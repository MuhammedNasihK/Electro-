<style>
    /* --- PURE CSS PRELOADER --- */
    .preloader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        
        /* THE FIX 1: Completely removed the white background and blur */
        background: transparent; 
        
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        
        /* THE FIX 2: Decreased the delay from 0.8s to 0.4s, and made the fade faster (0.3s) */
        animation: hidePreloader 0.3s ease-in-out 0.4s forwards;
    }

    /* --- MODERN BOUNCING DOTS ANIMATION --- */
    .spinner {
        display: flex;
        gap: 12px;
    }

    .spinner div {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background-color: #22c55e; /* Veintro Green */
        will-change: transform; 
        animation: bounce 1s infinite ease-in-out;
    }

    .spinner div:nth-child(2) {
        background-color: #0f172a; /* Veintro Primary Dark */
        animation-delay: 0.15s;
    }

    .spinner div:nth-child(3) {
        animation-delay: 0.3s;
    }

    @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-20px); }
    }

    /* Fade out logic */
    @keyframes hidePreloader {
        0% { opacity: 1; visibility: visible; }
        99% { opacity: 0; visibility: visible; }
        100% { 
            opacity: 0; 
            visibility: hidden; 
            z-index: -1; 
        }
    }
</style>

<div class="preloader">
    <div class="spinner">
        <div></div>
        <div></div>
        <div></div>
    </div>
</div>
